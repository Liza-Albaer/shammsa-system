<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎓 ⲇⲓⲁⲕⲱⲛ ⲙⲁⲣⲧ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      margin: 0;
      overflow-x: hidden;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2em;
      text-shadow: 0 0 8px rgba(0,0,0,0.4);
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      padding: 30px;
      width: 320px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.6s ease forwards;
    }

    input {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
      margin: 10px 0;
      font-size: 16px;
    }

    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      margin-top: 10px;
    }

    button:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    .loading {
      margin-top: 15px;
      font-size: 14px;
      color: #ddd;
    }

    .result-card {
      background: white;
      color: #333;
      padding: 50px;
      border-radius: 10px;
      margin-top: 20px;
      animation: fadeIn 0.7s ease forwards;
    }

    .result-card h3 {
      color: #4f46e5;
      margin-bottom: 10px;
    }

    .result-card table {
      width: 100%;
      border-collapse: collapse;
    }

    .result-card td {
      padding: 6px;
      border-bottom: 1px solid #eee;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
    }

    /* 🎁 Gifts Page */
    #gifts {
      display: none;
      animation: fadeIn 0.6s ease;
      text-align: center;
      max-width: 800px;
    }

    .gift-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .gift-item {
      background: white;
      color: #333;
      width: 160px;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .gift-item:hover {
      transform: scale(1.05);
    }

    .gift-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .gift-item h4 {
      margin: 8px 0 4px 0;
      color: #4f46e5;
    }

    .gift-item p {
      margin: 0;
      font-size: 14px;
    }
.disabled-gift {
  opacity: 0.4;
  filter: grayscale(100%);
  cursor: not-allowed;
}

.disabled-gift:hover {
  transform: none;
}

  </style>
</head>
<body>
  <h1>🎓ⲇⲓⲁⲕⲱⲛ ⲙⲁⲣⲧ</h1>
 

  <!-- Step 1: Input -->
  <div class="card" id="inputCard">
     <h4 style="align-items: center;"> Check your Points </h4>
    <p>Enter your Code:</p>
    <input type="text" id="codeInput" placeholder="e.g. 12345">
    <br>
    <button onclick="findRow()">Check Points</button>
    <div id="loading" class="loading" style="display:none;">Loading...</div>
    <div id="error" class="error" style="display:none;">❌ ID not found. Please try again.</div>
  </div>

  <!-- Step 2: Result -->
  <div id="result" class="result-card" style="display:none;">
    <h3>✅ Details</h3>
    <table id="resultTable"></table>
    <br>
    <button onclick="goBack()">Back</button>
    <button onclick="showGifts()">🎁 View Gifts</button>
  </div>

  <!-- Step 3: Gifts -->
  <div id="gifts">
    <h2>🎁 Available Gifts</h2>
    <div id="giftGrid" class="gift-grid"></div>
    <button onclick="backToResult()">⬅ Back to My Details</button>
  </div>

  <canvas id="confettiCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const baseURL = "https://opensheet.elk.sh/1TAaw7aCjwt1-rr12Q1R4SRABRpG3VzQUvfC3npKPKF8";
  const sheet1 = `${baseURL}/Sheet1`;
  const sheet2 = `${baseURL}/Sheet2`;
  var studentPoints = 0; // 🌟 store current student points from column "Sheet"
  var currentRow = null; // the student's Sheet1 row, kept so the details can be redrawn
  var localQty = {};     // ItemId -> quantity after our own redeems (opensheet may lag behind)

  function renderDetails() {
    const table = document.getElementById('resultTable');
    table.innerHTML = "";
    for (let key in currentRow) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><b>${key}</b></td><td>${currentRow[key]}</td>`;
      table.appendChild(tr);
    }
  }

 async function findRow() {
  const code = document.getElementById('codeInput').value.trim();
  const resultDiv = document.getElementById('result');
  const table = document.getElementById('resultTable');
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('error');

  if (!code) return;

  loading.style.display = "block";
  errorMsg.style.display = "none";
  resultDiv.style.display = "none";

  try {
    const res = await fetch(sheet1);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Unexpected Sheet1 response: " + JSON.stringify(data));

    const row = data.find(r => r.Code === code);

    loading.style.display = "none";

    if (row) {
      currentRow = row;
      localQty = {};
      renderDetails();
//console.log(row);
      // ✅ Save student's points from the "Points" column
      studentPoints = parseFloat(row.Points?.trim() || row["available"]?.trim() || 0);


      document.getElementById('inputCard').style.display = "none";
      resultDiv.style.display = "block";
      confetti();
    } else {
      errorMsg.style.display = "block";
    }

  } catch (err) {
    loading.style.display = "none";
    errorMsg.style.display = "block";
    console.error(err);
  }
}

  function goBack() {
    document.getElementById('inputCard').style.display = "block";
    document.getElementById('result').style.display = "none";
    document.getElementById('codeInput').value = "";
  }

  // 🎁 Show Gifts
 // 🎁 Show Gifts
async function showGifts() {
  const resultDiv = document.getElementById('result');
  const giftsDiv = document.getElementById('gifts');
  const grid = document.getElementById('giftGrid');

  resultDiv.style.display = "none";
  giftsDiv.style.display = "block";
  grid.innerHTML = "Loading gifts...";

  try {
    const res = await fetch(sheet2);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error("Unexpected Sheet2 response");

    // ✅ Filter gifts based on student points
    let remainingPoints = studentPoints;
    //const affordableGifts = data.filter(item => parseFloat(item.Value.toString().trim()) <= remainingPoints);
const allGifts = data;

    grid.innerHTML = "";

   // if (affordableGifts.length === 0) {
     // grid.innerHTML = `<p style="color:white;">😢 You don’t have enough points for any gifts yet.<br>Earn more to unlock rewards!</p>`;
      //return;
    //}

   

function getQuantity(item) {
  const raw = String(item.Quantity ?? "0").trim();
  // Preserve the minus sign and handle commas.
  const quantity = parseInt(raw.replace(/,/g, ""), 10);

  return Number.isFinite(quantity) ? quantity : 0;
}




allGifts.forEach(item => {
 const value = Number(
  String(item.Value ?? "0").replace(/,/g, "").replace(/[^\d.-]/g, "")
);

if (!Number.isFinite(value) || value <= 0) return;

let quantity = getQuantity(item);
// opensheet may still show the old quantity: never show more than our own redeem left.
if (localQty[item.ItemId] !== undefined) quantity = Math.min(quantity, localQty[item.ItemId]);
if (quantity < 0) return; // negative quantity: hide the item completely
const imgSrc = item.Image?.trim()
  || `https://via.placeholder.com/150?text=${encodeURIComponent(item.ItemName || "Gift")}`;
const remainingPoints = Number(studentPoints) || 0;

const canRedeem =
  value <= remainingPoints &&
  quantity > 0;


//console.log(item);
  const div = document.createElement("div");
  div.className = "gift-item";
  
  if (!canRedeem) {
  div.classList.add("disabled-gift");
}


div.innerHTML = `
  <img src="${imgSrc}" alt="${item.ItemName}">
  <h4>${item.ItemName}</h4>
  <p>🎯 Cost: ${value} pts</p>
  <p>📦 Quantity: ${quantity}</p>

  ${
    quantity <= 0
      ? `<p style="color:red;">❌ Out of stock</p>`
      : value > remainingPoints
      ? `<p style="color:red;">🔒 Not enough points</p>`
      : ``
  }
`;

  div.onclick = async () => {
    if (!canRedeem) {
      Swal.fire("❌ Not enough points", "Earn more points to unlock this gift", "info");
      return;
    }

    const confirm = await Swal.fire({
      title: `Redeem ${item.ItemName}?`,
      text: `It will cost ${value} points.`,
      icon: "question",
      showCancelButton: true,
      confirmButtonText: "Yes, redeem!",
    });

  if (confirm.isConfirmed) {
  Swal.fire({ title: "Processing...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });

  const result = await saveToSheet3({
    StudentCode: document.getElementById('codeInput').value.trim(),
    ItemName: item.ItemId,
    Value: value,
    Date: new Date().toLocaleString()
    // ❌ remove RemainingPoints — server calculates it now
  });

 if (result.success) {
  // Use the server's re-read balance/quantity; if missing, deduct from what was shown.
  // (Not re-fetched from opensheet: that copy can still be the old one.)
  const oldPoints = Number(studentPoints) || 0;
  const serverPoints = Number(result.remainingPoints);
  studentPoints = Number.isFinite(serverPoints) ? serverPoints : oldPoints - value;

  const serverQty = Number(result.remainingQuantity);
  localQty[item.ItemId] = Number.isFinite(serverQty) ? serverQty : quantity - 1;

  // Update the student's details table too.
  for (const key in currentRow) {
    const k = key.trim().toLowerCase();
    if (k === "available") currentRow[key] = studentPoints;
    if (k === "points used") currentRow[key] = (parseFloat(currentRow[key]) || 0) + (oldPoints - studentPoints);
  }
  renderDetails();

  await Swal.fire({
    title: "🎁 Redeemed!",
    text: `Remaining points: ${studentPoints}`,
    icon: "success",
    timer: 1800,
    showConfirmButton: false
  });

  await showGifts();
} else {
  await Swal.fire(
    "❌ Failed",
    (result.reason || "Redemption failed. Please try again.") +
      "\n\nThe gift list has been refreshed with the latest quantities.",
    "error"
  );

  // Refresh quantities and gift availability after a failed attempt.
  await showGifts();
}
}
 
 
  };

  grid.appendChild(div);
});

  } catch (err) {
    grid.innerHTML = "❌ Failed to load gifts.";
    console.error(err);
  }
}

  function backToResult() {
    document.getElementById('gifts').style.display = "none";
    document.getElementById('result').style.display = "block";
  }

  // 🎉 Simple confetti effect
  function confetti() {
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width = window.innerWidth;
    const h = canvas.height = window.innerHeight;
    const pieces = Array.from({length: 150}, () => ({
      x: Math.random() * w,
      y: Math.random() * h - h,
      size: Math.random() * 8 + 2,
      color: `hsl(${Math.random()*360},100%,50%)`,
      speed: Math.random() * 3 + 2
    }));

    function draw() {
      ctx.clearRect(0,0,w,h);
      for (let p of pieces) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
        p.y += p.speed;
        if (p.y > h) p.y = -10;
      }
      requestAnimationFrame(draw);
    }
    draw();

    setTimeout(() => ctx.clearRect(0,0,w,h), 3000);
  }


async function saveToSheet3(entry) {
 // const scriptURL = "https://script.google.com/macros/s/...your.../exec";

  // ── Check Sheet2 first: if the item's quantity is 0 (or less), don't save ──
  try {
    const stockRes = await fetch(sheet2);
    const items = await stockRes.json();
    if (!Array.isArray(items)) throw new Error("Unexpected Sheet2 response");
    const item = items.find(r => String(r.ItemId).trim() === String(entry.ItemName).trim());

    if (!item) {
      return { success: false, reason: "Item not found." };
    }

    const qty = parseInt(String(item.Quantity ?? "0").replace(/,/g, "").trim(), 10);
    if (!Number.isFinite(qty) || qty <= 0) {
      return { success: false, reason: "This item is out of stock." };
    }
  } catch (err) {
    console.error(err);
    return { success: false, reason: "Could not verify stock. Please try again." };
  }

  const scriptURLs = "https://script.google.com/macros/s/AKfycbzuIY4Vk1MBG0gLmfsBEZXZWeKw6GdEQl6OH1YG6SB0uQC1tNvwgw18_HCuGaL1CYNb/exec";
  const response = await fetch(scriptURLs, { method: "POST", body: JSON.stringify(entry) });
  return await response.json(); // ← return it so the caller can check result.success
}
</script>


</body>
</html>
